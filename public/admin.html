<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administração · ANTI CLT</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/estilo.css">
</head>
<body class="pagina-admin">
  <!-- Login exclusivo da administração: não aparece no menu do site -->
  <main class="admin-login">
    <form class="cartao admin-login__caixa" id="form-admin" novalidate>
      <a class="marca" href="/" style="margin-bottom:34px">
        <img class="marca__simbolo" src="/img/logo-simbolo.svg" alt="">
        <span class="marca__texto">
          <span class="marca__nome">ANTI<b>CLT</b></span>
          <span class="marca__sub">ADMINISTRAÇÃO</span>
        </span>
      </a>
      <div class="cartao__icone"><i data-icone="escudo"></i></div>
      <h1 style="font-size:28px;font-weight:500">Área administrativa</h1>
      <p class="texto-suave" style="font-size:15px">Acesso restrito à equipe. Aqui ficam a dashboard e a gestão de usuários e categorias.</p>
      <div id="mensagem"></div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input class="entrada" type="email" id="email" name="email" autocomplete="username" required>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input class="entrada" type="password" id="senha" name="senha" autocomplete="current-password" required>
      </div>
      <button class="botao botao--claro botao--bloco" type="submit">Entrar na dashboard</button>
      <p class="form-rodape"><a href="/">Voltar ao site</a></p>
    </form>
  </main>

  <script src="/js/icones.js"></script>
  <script src="/js/comum.js"></script>
  <script>
    const formAdmin = document.getElementById('form-admin');

    // Já logado como admin? Vai direto para a dashboard
    if (sessao.usuario?.tipo === 'admin' && sessao.token) location.href = '/dashboard';

    formAdmin.addEventListener('submit', async (e) => {
      e.preventDefault();
      const botao = formAdmin.querySelector('[type=submit]');
      botao.disabled = true;
      document.getElementById('mensagem').innerHTML = '';
      try {
        const { token, usuario } = await api('/auth/login', {
          metodo: 'POST',
          corpo: { email: formAdmin.email.value, senha: formAdmin.senha.value, area: 'admin' },
        });
        sessao.salvar(token, usuario);
        location.href = '/dashboard';
      } catch (erro) {
        document.getElementById('mensagem').innerHTML = `<div class="alerta alerta--erro">${esc(erro.message)}</div>`;
        botao.disabled = false;
      }
    });
  </script>
</body>
</html>
