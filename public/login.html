<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · ANTI CLT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
  <header class="topo" id="topo"></header>

  <main class="dividida">
    <aside class="dividida__arte">
      <img id="arte" src="/img/portfolio/montador-2.svg" alt="">
      <div class="dividida__frase">
        <h2 id="arte-titulo">Bem-vindo de volta.</h2>
        <p id="arte-texto">Entre para publicar vagas de diária e ver quem tem interesse.</p>
      </div>
    </aside>

    <section class="dividida__form">
      <form class="form-caixa" id="form-login" novalidate>
        <h1>Entrar</h1>
        <p class="subtitulo">Escolha como você usa o ANTI CLT.</p>

        <!-- Duas áreas de acesso: cliente e prestador -->
        <div class="abas abas--cheia" role="tablist" id="areas">
          <button type="button" class="aba ativa" role="tab" data-area="cliente"><i data-icone="empresa"></i> Sou cliente</button>
          <button type="button" class="aba" role="tab" data-area="prestador"><i data-icone="maleta"></i> Sou prestador</button>
        </div>

        <div id="mensagem" style="margin-top:22px"></div>

        <div class="campo">
          <label for="email">E-mail</label>
          <input class="entrada" type="email" id="email" name="email" placeholder="seu-email@exemplo.com" autocomplete="email" required>
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <div class="senha-caixa">
            <input class="entrada" type="password" id="senha" name="senha" placeholder="Sua senha" autocomplete="current-password" required>
            <button type="button" id="ver-senha" aria-label="Mostrar senha"><i data-icone="olho"></i></button>
          </div>
        </div>

        <button class="botao botao--claro botao--bloco" type="submit" id="botao-entrar" style="margin-top:8px">Entrar como cliente</button>
        <p class="form-rodape">Ainda não tem conta? <a href="/cadastro?tipo=contratante" id="link-cadastro">Cadastre-se grátis</a></p>

        <div class="contas-teste">
          <strong style="color:var(--texto-2)">Contas de teste (senha 123456):</strong><br>
          <button type="button" data-conta="contato@mercadinho.exemplo" data-area-teste="cliente">cliente</button> ·
          <button type="button" data-conta="renato.siqueira@email.exemplo" data-area-teste="prestador">prestador</button>
        </div>
      </form>
    </section>
  </main>

  <script src="/js/icones.js"></script>
  <script src="/js/comum.js"></script>
  <script>
    // Login com duas áreas: cliente (contratante) e prestador.
    // A administração entra por /admin.
    const form = document.getElementById('form-login');
    const mensagem = document.getElementById('mensagem');
    const TEXTOS = {
      cliente: {
        botao: 'Entrar como cliente', cadastro: '/cadastro?tipo=contratante', arte: 'montador-2',
        titulo: 'Bem-vindo de volta.', texto: 'Entre para publicar vagas de diária e ver quem tem interesse.',
      },
      prestador: {
        botao: 'Entrar como prestador', cadastro: '/cadastro?tipo=prestador', arte: 'pedreiro-2',
        titulo: 'Olá, trabalhador!', texto: 'Entre para atualizar seu portfólio e acompanhar as vagas da sua área.',
      },
    };
    let area = parametro('area') === 'prestador' ? 'prestador' : 'cliente';

    function trocarArea(nova) {
      area = nova;
      const t = TEXTOS[area];
      document.querySelectorAll('#areas .aba').forEach((b) => b.classList.toggle('ativa', b.dataset.area === area));
      document.getElementById('botao-entrar').textContent = t.botao;
      document.getElementById('link-cadastro').href = t.cadastro;
      document.getElementById('arte').src = `/img/portfolio/${t.arte}.svg`;
      document.getElementById('arte-titulo').textContent = t.titulo;
      document.getElementById('arte-texto').textContent = t.texto;
      mensagem.innerHTML = '';
    }

    document.getElementById('areas').addEventListener('click', (e) => {
      const b = e.target.closest('[data-area]');
      if (b) trocarArea(b.dataset.area);
    });

    document.getElementById('ver-senha').addEventListener('click', () => {
      const campo = document.getElementById('senha');
      campo.type = campo.type === 'password' ? 'text' : 'password';
    });

    document.querySelectorAll('[data-conta]').forEach((b) => b.addEventListener('click', () => {
      trocarArea(b.dataset.areaTeste);
      form.email.value = b.dataset.conta;
      form.senha.value = '123456';
    }));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      mensagem.innerHTML = '';
      const botao = document.getElementById('botao-entrar');
      botao.disabled = true;
      try {
        const { token, usuario } = await api('/auth/login', {
          metodo: 'POST',
          corpo: { email: form.email.value, senha: form.senha.value, area },
        });
        sessao.salvar(token, usuario);
        const voltar = parametro('voltar');
        location.href = voltar && voltar.startsWith('/') && !voltar.startsWith('/dashboard') ? voltar : '/painel';
      } catch (erro) {
        mensagem.innerHTML = `<div class="alerta alerta--erro">${esc(erro.message)}</div>`;
        botao.disabled = false;
      }
    });

    trocarArea(area);
  </script>
</body>
</html>
