<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro · ANTI CLT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
  <header class="topo" id="topo"></header>

  <main class="dividida">
    <aside class="dividida__arte">
      <img id="arte" src="/img/portfolio/eletricista-3.svg" alt="">
      <div class="dividida__frase">
        <h2 id="arte-titulo">Faça parte do trabalho livre.</h2>
        <p id="arte-texto">Mostre seu portfólio, defina seus horários e combine o valor direto com o cliente.</p>
      </div>
    </aside>

    <section class="dividida__form">
      <!-- O conteúdo de cada etapa é desenhado pelo js/cadastro.js -->
      <div class="form-caixa form-caixa--larga" id="etapa"></div>
    </section>
  </main>

  <script src="/js/icones.js"></script>
  <script src="/js/comum.js"></script>
  <script src="/js/formularios.js"></script>
  <script src="/js/cadastro.js"></script>
</body>
</html>
