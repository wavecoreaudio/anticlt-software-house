<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfólio de prestadores · ANTI CLT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
  <header class="topo" id="topo"></header>

  <main>
    <section class="cabeca-pagina">
      <div class="container">
        <span class="rotulo">Área aberta · sem login</span>
        <h1>Portfólio</h1>
        <p class="subtitulo">Profissionais de Porto Velho com fotos dos trabalhos e contato direto. Escolha uma categoria nas abas.</p>
      </div>
    </section>

    <section class="container" style="padding-bottom:110px">
      <nav class="abas" id="abas" aria-label="Categorias" style="margin-bottom:16px"></nav>
      <div class="barra-filtros">
        <label class="busca">
          <span class="sr-only">Buscar</span>
          <i data-icone="busca"></i>
          <input class="entrada" type="search" id="busca" placeholder="Buscar por nome, bairro ou serviço">
        </label>
        <div class="filtros-extra">
          <label><span class="sr-only">Bairro</span>
            <select class="entrada" id="bairro"><option value="">Todos os bairros</option></select></label>
          <label><span class="sr-only">Ordenar</span>
            <select class="entrada" id="ordem">
              <option value="recentes">Mais recentes</option>
              <option value="avaliacao">Mais bem avaliados</option>
              <option value="experiencia">Mais experientes</option>
              <option value="nome">Nome (A–Z)</option>
            </select></label>
        </div>
      </div>
      <div class="resultado-cabecalho">
        <p class="resultado-info" id="info" aria-live="polite"></p>
        <div class="filtros-ativos" id="filtros-ativos" aria-label="Filtros aplicados"></div>
        <button class="limpar-filtros oculto" id="limpar-filtros" type="button">Limpar filtros</button>
      </div>
      <div class="grade-posts" id="lista"><p class="carregando">Carregando prestadores…</p></div>
      <div class="carregar-mais"><button class="botao oculto" id="mais">Carregar mais</button></div>
    </section>
  </main>

  <footer class="rodape" id="rodape"></footer>
  <script src="/js/icones.js"></script>
  <script src="/js/comum.js"></script>
  <script src="/js/carrossel.js"></script>
  <script src="/js/portfolio.js"></script>
</body>
</html>
